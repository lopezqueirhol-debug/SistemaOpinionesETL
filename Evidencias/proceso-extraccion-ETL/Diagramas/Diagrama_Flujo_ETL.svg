<svg viewBox="0 0 1000 980" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="980" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Diagrama de flujo - Ciclo del EtlExtractionWorker</text>

  <!-- Inicio -->
  <rect x="400" y="60" width="200" height="44" rx="22" fill="#111827"/>
  <text x="500" y="87" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Inicio del Worker Service</text>
  <line x1="500" y1="104" x2="500" y2="128" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Inicio de ciclo -->
  <rect x="380" y="130" width="240" height="46" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="500" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">Ciclo N: Stopwatch.Start()</text>
  <text x="500" y="168" text-anchor="middle" font-size="9" fill="#312e81">Crear SemaphoreSlim(MaxConcurrency)</text>
  <line x1="500" y1="176" x2="500" y2="200" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Bifurcacion a 3 ramas via Task.WhenAll -->
  <text x="500" y="210" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4b5563">Task.WhenAll (3 extractores en paralelo, cada uno espera el semaforo)</text>

  <line x1="500" y1="214" x2="180" y2="250" stroke="#374151" stroke-width="1.4"/>
  <line x1="500" y1="214" x2="500" y2="250" stroke="#374151" stroke-width="1.4"/>
  <line x1="500" y1="214" x2="820" y2="250" stroke="#374151" stroke-width="1.4"/>

  <!-- Rama CSV -->
  <rect x="60" y="252" width="240" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="180" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">CsvExtractor.ExtractAsync</text>
  <line x1="180" y1="292" x2="180" y2="316" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <rect x="60" y="318" width="240" height="54" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="180" y="338" text-anchor="middle" font-size="10" fill="#1e3a8a">Leer surveys_part1.csv con CsvHelper</text>
  <text x="180" y="354" text-anchor="middle" font-size="10" fill="#1e3a8a">Mapear fila &#8594; ExtractedRecord</text>
  <text x="180" y="366" text-anchor="middle" font-size="9" fill="#6b7280">try/catch propio (no detiene al ciclo)</text>

  <!-- Rama DB -->
  <rect x="380" y="252" width="240" height="40" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="500" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">DatabaseExtractor.ExtractAsync</text>
  <line x1="500" y1="292" x2="500" y2="316" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <rect x="380" y="318" width="240" height="54" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="500" y="338" text-anchor="middle" font-size="10" fill="#14532d">MySqlConnection.OpenAsync</text>
  <text x="500" y="354" text-anchor="middle" font-size="10" fill="#14532d">Ejecutar ReviewsQuery &#8594; ExtractedRecord</text>
  <text x="500" y="366" text-anchor="middle" font-size="9" fill="#6b7280">0 registros si no hay cadena configurada</text>

  <!-- Rama API -->
  <rect x="700" y="252" width="240" height="40" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="820" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">ApiExtractor.ExtractAsync</text>
  <line x1="820" y1="292" x2="820" y2="316" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <rect x="700" y="318" width="240" height="54" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="820" y="338" text-anchor="middle" font-size="10" fill="#7f1d1d">GET /comments + cabecera X-Api-Key</text>
  <text x="820" y="354" text-anchor="middle" font-size="10" fill="#7f1d1d">Deserializar JSON &#8594; ExtractedRecord</text>
  <text x="820" y="366" text-anchor="middle" font-size="9" fill="#6b7280">0 registros si no hay URL configurada</text>

  <!-- Convergen a staging -->
  <line x1="180" y1="372" x2="180" y2="420" stroke="#374151" stroke-width="1.4"/>
  <line x1="500" y1="372" x2="500" y2="420" stroke="#374151" stroke-width="1.4"/>
  <line x1="820" y1="372" x2="820" y2="420" stroke="#374151" stroke-width="1.4"/>
  <line x1="180" y1="420" x2="500" y2="420" stroke="#374151" stroke-width="1.4"/>
  <line x1="820" y1="420" x2="500" y2="420" stroke="#374151" stroke-width="1.4"/>
  <line x1="500" y1="420" x2="500" y2="444" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <rect x="340" y="446" width="320" height="56" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="500" y="469" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">JsonStagingLoader.SaveBatchAsync</text>
  <text x="500" y="486" text-anchor="middle" font-size="9.5" fill="#713f12">archivo unico por fuente (timestamp + sufijo random)</text>

  <line x1="500" y1="502" x2="500" y2="526" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Decision por fuente: exito / error -->
  <polygon points="500,528 580,560 500,592 420,560" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="500" y="556" text-anchor="middle" font-size="9.5" fill="#1f2937">&#191;Extraccion</text>
  <text x="500" y="568" text-anchor="middle" font-size="9.5" fill="#1f2937">exitosa?</text>

  <line x1="580" y1="560" x2="700" y2="560" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="640" y="552" text-anchor="middle" font-size="9.5" fill="#374151">si</text>
  <rect x="700" y="536" width="230" height="48" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="815" y="556" text-anchor="middle" font-size="10" fill="#14532d">ILogger.LogInformation</text>
  <text x="815" y="570" text-anchor="middle" font-size="9" fill="#14532d">registros, ms, fuente, tipo</text>

  <line x1="420" y1="560" x2="300" y2="560" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="360" y="552" text-anchor="middle" font-size="9.5" fill="#374151">no</text>
  <rect x="70" y="536" width="230" height="48" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="185" y="556" text-anchor="middle" font-size="10" fill="#7f1d1d">ILogger.LogError (catch local)</text>
  <text x="185" y="570" text-anchor="middle" font-size="9" fill="#7f1d1d">las otras 2 fuentes continuan</text>

  <line x1="185" y1="584" x2="185" y2="612" stroke="#374151" stroke-width="1.4"/>
  <line x1="815" y1="584" x2="815" y2="612" stroke="#374151" stroke-width="1.4"/>
  <line x1="185" y1="612" x2="500" y2="612" stroke="#374151" stroke-width="1.4"/>
  <line x1="815" y1="612" x2="500" y2="612" stroke="#374151" stroke-width="1.4"/>
  <line x1="500" y1="612" x2="500" y2="636" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <rect x="320" y="638" width="360" height="56" rx="6" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="500" y="661" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">Fin del ciclo: Stopwatch.Stop()</text>
  <text x="500" y="678" text-anchor="middle" font-size="9.5" fill="#312e81">Log: total ms, fuentes ok/total, reg/s, mas lenta</text>

  <line x1="500" y1="694" x2="500" y2="718" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <polygon points="500,720 600,756 500,792 400,756" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="500" y="752" text-anchor="middle" font-size="9.5" fill="#1f2937">&#191;Cancelacion</text>
  <text x="500" y="764" text-anchor="middle" font-size="9.5" fill="#1f2937">solicitada</text>
  <text x="500" y="776" text-anchor="middle" font-size="9.5" fill="#1f2937">(Ctrl+C)?</text>

  <line x1="600" y1="756" x2="760" y2="756" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="680" y="748" text-anchor="middle" font-size="9.5" fill="#374151">no</text>
  <rect x="760" y="732" width="190" height="48" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="855" y="752" text-anchor="middle" font-size="10" fill="#713f12">Task.Delay(IntervalMinutes)</text>
  <text x="855" y="766" text-anchor="middle" font-size="9" fill="#713f12">por defecto 15 min</text>

  <path d="M855,732 C855,650 620,170 620,152" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow2)"/>
  <text x="900" y="400" font-size="9.5" fill="#6b7280" transform="rotate(90 900 400)">vuelve al Ciclo N+1</text>

  <line x1="400" y1="756" x2="240" y2="756" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="320" y="748" text-anchor="middle" font-size="9.5" fill="#374151">si</text>
  <rect x="60" y="732" width="180" height="48" rx="24" fill="#111827"/>
  <text x="150" y="760" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">Fin (graceful shutdown)</text>

  <rect x="60" y="830" width="880" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="80" y="854" font-size="11" font-weight="700" fill="#111827">Notas de resiliencia</text>
  <text x="80" y="874" font-size="10" fill="#374151">• Cada extractor tiene su propio try/catch: un fallo se registra y no tumba a las otras fuentes ni al ciclo.</text>
  <text x="80" y="892" font-size="10" fill="#374151">• OperationCanceledException se relanza para permitir un apagado limpio del host (Ctrl+C).</text>
  <text x="80" y="910" font-size="10" fill="#374151">• SemaphoreSlim(MaxConcurrency) limita cuantas fuentes corren a la vez (protege BD, API y disco).</text>
  <text x="80" y="928" font-size="10" fill="#374151">• Archivos de staging con timestamp + sufijo aleatorio: nunca colisionan aunque dos fuentes terminen juntas.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
